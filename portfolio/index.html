<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Name | Machine Learning & Python Developer</title>
    <meta name="description" content="Portfolio of a Machine Learning and Python developer.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Name | Machine Learning & Python Developer">
    <meta property="og:description" content="Portfolio of a Machine Learning and Python developer.">
    <meta property="og:image" content="assets/profile.svg">
    <meta name="theme-color" content="#0f1420">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script>
        /* Apply saved theme before first paint to avoid a flash */
        try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <nav class="nav container" aria-label="Main">
            <a class="brand" href="#home" id="nav-brand">Portfolio</a>
            <ul class="nav-links" id="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#certifications">Certifications</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
            <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        </nav>
    </header>

    <main id="main">
        <section class="hero" id="home">
            <div class="container hero-grid">
                <div id="hero-content" class="hero-copy"></div>
                <figure class="loss-plot" aria-hidden="true">
                    <svg viewBox="0 0 400 260" role="presentation">
                        <g class="grid"><path d="M40 30H380M40 90H380M40 150H380M40 210H380"/></g>
                        <path class="axis" d="M40 20V210H385"/>
                        <path class="curve curve-val" d="M40 62C75 105 100 150 140 164S230 172 270 160S340 150 380 156"/>
                        <path class="curve curve-train" d="M40 40C70 100 100 150 140 177S230 192 270 196S340 200 380 202"/>
                        <text x="40" y="238">epoch</text>
                        <text x="48" y="16">loss</text>
                    </svg>
                    <figcaption>
                        <span><i class="key key-train"></i>train</span>
                        <span><i class="key key-val"></i>validation</span>
                    </figcaption>
                </figure>
            </div>
        </section>

        <section class="section" id="about" aria-labelledby="about-title">
            <div class="container">
                <h2 id="about-title">About</h2>
                <div class="about reveal" id="about-content"></div>
            </div>
        </section>

        <section class="section alt" id="skills" aria-labelledby="skills-title">
            <div class="container">
                <h2 id="skills-title">Skills</h2>
                <div class="grid skills-grid" id="skills-grid"></div>
            </div>
        </section>

        <section class="section" id="projects" aria-labelledby="projects-title">
            <div class="container">
                <h2 id="projects-title">Projects</h2>
                <div class="filters" id="project-filters" role="group" aria-label="Filter projects by category"></div>
                <div class="grid projects-grid" id="projects-grid"></div>
            </div>
        </section>

        <section class="section alt" id="education" aria-labelledby="education-title">
            <div class="container">
                <h2 id="education-title">Education</h2>
                <ol class="timeline" id="education-list"></ol>
            </div>
        </section>

        <section class="section" id="certifications" aria-labelledby="cert-title">
            <div class="container">
                <h2 id="cert-title">Certifications</h2>
                <div class="grid cert-grid" id="certifications-grid"></div>
            </div>
        </section>

        <section class="section alt" id="contact" aria-labelledby="contact-title">
            <div class="container contact">
                <h2 id="contact-title">Contact</h2>
                <div id="contact-content" class="contact-content"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container"><p>&copy; <span id="year"></span> <span id="footer-name"></span></p></div>
    </footer>

    <noscript><p class="container" style="padding:2rem 0">This portfolio needs JavaScript enabled to display its content.</p></noscript>
    <script src="data/portfolio.js"></script>
    <script src="script.js"></script>
</body>
</html>
